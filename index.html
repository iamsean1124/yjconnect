<style>

    /* 피드 */

}

/* 기존 .content-area.collapsed를 이걸로 덮어쓰기 */
.content-area.collapsed { 
    display: block;    
    position: relative;
    /* 기존에 있던 max-height: 160px; 과 overflow: hidden; 을 지웠습니다! */
}

    /* 댓글 */

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let base64Img = "";

    function toggleSidebar(on) {
        document.getElementById('sidebar').classList.toggle('open', on);
        document.querySelector('.overlay').style.display = on ? 'block' : 'none';
    }

    // 사진 압축 및 미리보기
    function previewFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 400; // 사진 크기 강제 축소 (서버 안 터지게)
                    let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    base64Img = canvas.toDataURL('image/jpeg', 0.6); // 용량 압축
                    document.getElementById('imgPreview').src = base64Img;
                    document.getElementById('prevBox').style.display = 'block';
                }
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function uploadPost() {
        const nick = document.getElementById('nick').value || "익명";
        const pw = document.getElementById('pw').value;
        const text = document.getElementById('text').value;
        if(!text || !pw) return alert("내용과 비번을 적어주세요!");

        document.getElementById('postBtn').disabled = true;
        db.ref('posts').push({
            nick, pw, text, img: base64Img, time: Date.now()
        }).then(() => location.reload());
    }

db.ref('posts').orderByChild('time').on('value', snap => {
    const feed = document.getElementById('feed');
    feed.innerHTML = ""; 
    
    let posts = [];
    snap.forEach(c => posts.push({id: c.key, ...c.val()}));
    
    posts.reverse().forEach(p => {
        const item = document.createElement('div');
        item.className = 'feed-item';
        
        item.innerHTML = `
            <div class="item-header" style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <b>${p.nick}</b> 
                <span onclick="delPost('${p.id}','${p.pw}')" style="cursor:pointer; color:#999; font-size:12px;">삭제</span>
            </div>
            <div class="content-area collapsed" id="c-${p.id}">
                ${p.img ? `<div style="margin-bottom:10px;"><img src="${p.img}" class="feed-img" style="width:100%; border-radius:8px;"></div>` : ''}
                <div style="white-space: pre-wrap; word-break: break-all;">${p.text}</div>
            </div>
            <div class="more-btn" id="m-${p.id}" onclick="this.style.display='none';document.getElementById('c-${p.id}').style.maxHeight='none'" style="color:#007bff; cursor:pointer; font-size:13px; margin-top:5px; margin-bottom:10px;">더보기...</div>
            
            <div class="comment-section" id="cmts-${p.id}" style="background:#f9f9f9; border-radius:8px; padding:8px;"></div>
            
            <div class="comment-input-row" style="margin-top:10px;">
                <input type="text" id="cn-${p.id}" placeholder="닉네임" style="width:50px">
                <input type="text" id="ct-${p.id}" placeholder="댓글" style="flex:1;">
                <input type="password" id="cp-${p.id}" placeholder="비번" style="width:40px">
                <button class="cmt-btn" onclick="addCmt('${p.id}')">ok</button>
            </div>`;

        // 화면에 게시글 상자를 먼저 붙입니다.
        feed.appendChild(item);

        // 그 다음 상자 안에 댓글들을 채워 넣습니다.
        if(p.comments) {
            const cmtBox = document.getElementById('cmts-' + p.id);
            Object.keys(p.comments).forEach(k => {
                const c = p.comments[k];
                const cmtDiv = document.createElement('div');
                cmtDiv.style.fontSize = "12px";
                cmtDiv.style.marginBottom = "4px";
                cmtDiv.innerHTML = `<b>${c.nick}</b>: ${c.text} <span class="comment-del" style="color:red; cursor:pointer; margin-left:5px;" onclick="delCmt('${p.id}','${k}','${c.pw}')">x</span>`;
                cmtBox.appendChild(cmtDiv);
            });
        }
    });
});

    window.delPost = (id, opw) => {
        const p = prompt("비밀번호");
        if(p === opw || p === "gksmfdl0416!") db.ref('posts').child(id).remove();
    };

    window.addCmt = (pid) => {
        const n = document.getElementById('cn-'+pid).value || "익명";
        const t = document.getElementById('ct-'+pid).value;
        const p = document.getElementById('cp-'+pid).value;
        if(t && p) db.ref(`posts/${pid}/comments`).push({nick:n, text:t, pw:p});
    };

    window.delCmt = (pid, cid, opw) => {
        const p = prompt("댓글 비번");
        if(p === opw || p === "gksmfdl0416!") db.ref(`posts/${pid}/comments`).child(cid).remove();
    };
</script>
